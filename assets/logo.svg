<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- orbital ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.35"/>
  <ellipse cx="256" cy="256" rx="150" ry="62" fill="none" stroke="url(#accent2)" stroke-width="3" opacity="0.45" transform="rotate(-28 256 256)"/>
  <ellipse cx="256" cy="256" rx="150" ry="62" fill="none" stroke="url(#accent2)" stroke-width="3" opacity="0.25" transform="rotate(28 256 256)"/>

  <!-- central rewind glyph: two chevrons pointing back -->
  <g filter="url(#glow)">
    <path d="M300 176 L204 256 L300 336" fill="none" stroke="url(#accent)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M356 196 L286 256 L356 316" fill="none" stroke="url(#accent2)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- orbit dots -->
  <circle cx="256" cy="106" r="13" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="406" cy="256" r="10" fill="#c084fc" opacity="0.9"/>
  <circle cx="256" cy="406" r="10" fill="#22d3ee" opacity="0.9"/>

  <!-- key badge -->
  <g transform="translate(330 330)">
    <circle cx="52" cy="52" r="70" fill="#0b1220" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="40" cy="40" r="17" fill="none" stroke="#e2e8f0" stroke-width="8"/>
    <rect x="50" y="33" width="44" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="78" y="33" width="10" height="26" rx="5" fill="#e2e8f0"/>
    <rect x="58" y="33" width="10" height="22" rx="5" fill="#e2e8f0"/>
  </g>
</svg>
